name: build

# Compile every module and build the host on every push / PR. The compiled
# .amx modules are uploaded as an artifact you can download and load on a
# Windows machine (unrestricted driver) without installing a compiler locally.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  modules:
    name: Compile Pawn modules
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build modules
        shell: pwsh
        run: scripts\build.ps1

      - name: Show results
        shell: pwsh
        run: Get-ChildItem build

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: build/*.amx
          if-no-files-found: error

  host:
    name: Build C# host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release --nologo host\csharp
